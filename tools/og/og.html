<!doctype html>

<meta charset="utf-8">
<!-- 1200x630 link preview. Everything that matters sits inside the centre 630x630 square, because
     WhatsApp and some messengers crop previews to a square; the sides are scenery. -->
<style>
  @font-face { font-family: Oswald; src: url(../../src/assets/fonts/oswald.woff2) format("woff2"); font-weight: 200 700; }
  @font-face { font-family: "Unbounded KG"; src: url(../../src/assets/fonts/unbounded-kg.woff2) format("woff2"); font-weight: 200 900; }
  @font-face { font-family: Onest; src: url(../../src/assets/fonts/onest.woff2) format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #090f22; }
  /* the 2560x1440 render scaled so the car is ~600px wide and centred */
  .stage { position: absolute; left: -12px; top: -150px; width: 1240px; height: 697.5px; }
  .stage img { position: absolute; display: block; }
  .road { inset: 0; width: 100%; height: 100%; }
  .shade { position: absolute; inset: 0; background:
      linear-gradient(to bottom, rgb(9 15 34 / .55), rgb(9 15 34 / .1) 34%, transparent 46%),
      linear-gradient(to top, #090f22 10%, rgb(9 15 34 / .6) 26%, transparent 40%); }
  .word { position: absolute; left: 50%; top: 326px; translate: -50% -100%; margin: 0; font: 700 132px/.81 Oswald; color: #fff; white-space: nowrap; text-shadow: 0 .02em .3em rgb(6 12 30 / .25); }
  .car { left: 24.453%; top: 42.153%; width: 48.32%; height: 39.306%; }
  .kicker { position: absolute; left: 50%; top: 26px; translate: -50% 0; display: flex; gap: 10px; align-items: center; font: 700 16px/1 "Unbounded KG"; letter-spacing: .22em; color: #f6c443; white-space: nowrap; }
  .kicker svg { width: 20px; height: 20px; }
  .bottom { position: absolute; left: 50%; bottom: 28px; translate: -50% 0; display: grid; justify-items: center; gap: 14px; }
  .pill { padding: 12px 18px 11px; border-radius: 12px; background: #f6c443; color: #090f22; font: 800 23px/1 "Unbounded KG"; text-transform: uppercase; white-space: nowrap; }
  .wa { display: flex; align-items: center; gap: 12px; padding: 7px 20px 7px 7px; border-radius: 999px; background: rgb(9 15 34 / .7); border: 1px solid rgb(255 255 255 / .16); font: 800 27px/1 "Unbounded KG"; color: #fff; letter-spacing: -.01em; white-space: nowrap; }
  .wa i { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: #25d366; }
  .side { position: absolute; top: 50%; translate: 0 -50%; font: 600 15px/1.35 Onest; color: rgb(255 255 255 / .85); text-shadow: 0 1px 10px rgb(6 12 30 / .5); }
  .side--l { left: 34px; } .side--r { right: 34px; text-align: right; }
  .side b { display: block; font: 800 14px/1 "Unbounded KG"; letter-spacing: .14em; color: #f6c443; margin-bottom: 6px; }
</style>
